<head>

<title>Beer Game Atelier</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=Bungee&display=swap">
<style>
/* Layout : une table de jeu. En-tête d'état, onglets par usage (poste, animation, débrief, règles, guide),
   et la chaîne logistique toujours dessinée de gauche (fournisseur) à droite (client). */
:root{
  color-scheme:dark;
  --bg:#120c06; --surface:#1d140b; --sunk:#2a1d0f; --ink:#fff3dc; --ink2:#e2cfa8; --muted:#a8936c;
  --line:#4a3618; --axis:#6b5026; --brand:#f5a623; --brand-ink:#1a1005; --brand-soft:#3b2a0c;
  --amber:#ffd166; --amber-soft:#3a2a10;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#2fc52f; --crit:#ff6b6b; --warn-bg:#3a2a10; --warn-ink:#ffd98a;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em} h2{font-size:19px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0} .prose{max-width:66ch;display:flex;flex-direction:column;gap:10px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand span{color:var(--muted);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.pill.on{background:var(--brand-soft);color:var(--ink)} .pill.amber{background:var(--amber-soft);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:0;background:none;font:inherit;font-weight:500;color:var(--ink2);padding:9px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px} .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--axis);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink2)} .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)} .btn.sm{padding:4px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:7px 10px;max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);font-weight:500;min-width:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:9px 12px;font-size:13.5px}
.info{background:var(--sunk);border-radius:8px;padding:9px 12px;font-size:13.5px;color:var(--ink2)}
.seat{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-top:3px solid var(--c)}
.seat.mine{background:var(--brand-soft)}
.seat .who{font-weight:600}
/* chaîne du poste */
.chain{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:4px}
.node{flex:1 0 108px;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--sunk);min-width:108px}
.node b{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.node.stock{background:var(--brand-soft);border-color:var(--brand)} .node.late b{color:var(--crit)}
.arrow{align-self:center;color:var(--muted);flex:none;font-size:18px}
.order{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:14px;border-radius:10px;background:var(--amber-soft)}
.order input{width:110px;font-size:22px;font-family:var(--display);font-weight:600;text-align:center}
.tw{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--ink2);font-size:12.5px} th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.tile b{font-family:var(--display);font-size:24px}
.chart{position:relative;overflow-x:auto} .chart svg{display:block;min-width:600px;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed}
.tip{position:absolute;top:8px;pointer-events:none;background:var(--surface);border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:150px;z-index:2}
.tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:20;max-width:90vw}
details summary{cursor:pointer;font-weight:600}
.steps{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.steps span:nth-child(odd){font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

/* ---- habillage jeu ---- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* la bande du bas reste toujours dégagée pour la chaîne animée */
html,body{height:100%} body{overflow:hidden}
#scroll{position:relative;z-index:1;height:calc(100% - clamp(84px,16vw,180px));overflow-y:auto;-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.wrap{padding-block:20px 40px}
.panel{background:rgba(27,18,9,.9);box-shadow:0 0 0 1px rgba(245,166,35,.06),0 14px 34px rgba(0,0,0,.45);backdrop-filter:blur(5px);border-radius:14px}
h1{font-family:"Bungee",var(--display);font-weight:400;font-size:28px;color:var(--brand);text-shadow:0 2px 0 #7a4a05,0 0 22px rgba(245,166,35,.45);letter-spacing:.02em}
h2{text-transform:uppercase;letter-spacing:.04em}
.eyebrow,th{font-family:var(--display)}
.btn{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;border-radius:10px;background:#2a1d0f;box-shadow:0 3px 0 #0a0603;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0603}
.btn.primary{background:linear-gradient(#ffc24d,#f5a623);border-color:#ffd98a;color:#1a1005;box-shadow:0 3px 0 #8a5a08,0 0 18px rgba(245,166,35,.35)}
.btn.primary:active{box-shadow:0 1px 0 #8a5a08}
.pill{font-family:var(--display);border:1px solid var(--line);background:#21160a}
.pill.on{background:#3b2a0c;border-color:var(--brand);color:var(--brand)}
.tabs{border-bottom:0;gap:6px;padding-bottom:4px}
.tab{font-family:var(--display);text-transform:uppercase;letter-spacing:.05em;font-size:13px;background:rgba(27,18,9,.85);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.tab[aria-selected="true"]{background:var(--brand);color:#1a1005;border-color:#ffd98a}
.seat{background:rgba(33,22,10,.92);transition:transform .12s}
.seat:hover{transform:translateY(-3px)}
.seat.mine{background:#3b2a0c;box-shadow:0 0 0 1px var(--c),0 0 22px rgba(245,166,35,.25)}
.node{background:#21160a}
.node b{font-size:30px}
.node.stock{background:#3b2a0c;box-shadow:inset 0 0 18px rgba(245,166,35,.25)}
.node.stock b{color:var(--brand)}
.node.late{border-color:var(--crit);animation:alarm 1.2s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 16px rgba(255,107,107,.5)}}
.arrow{color:var(--brand);animation:flow 1s ease-in-out infinite}
@keyframes flow{50%{transform:translateX(4px)}}
.crates{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0;max-width:120px}
.crates i{width:9px;height:9px;border-radius:2px;background:linear-gradient(#ffc24d,#c98500);border:1px solid #7a4a05}
.order{background:linear-gradient(180deg,#3b2a0c,#2a1d0f);border:1px solid var(--brand);box-shadow:0 0 24px rgba(245,166,35,.18)}
.order input{background:#120c06;border-color:var(--brand);color:var(--brand);width:120px;font-size:28px}
.order input::placeholder{color:#7a5a2c}
.order input:focus{box-shadow:0 0 0 3px rgba(245,166,35,.35)}
.lights{display:flex;flex-wrap:wrap;gap:8px}
.light{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#21160a;font-size:12.5px;font-family:var(--display);color:var(--muted)}
.light .dot{background:#5a4424}
.light.ok{color:var(--ink);border-color:var(--good)}
.light.ok .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.tile{background:rgba(33,22,10,.92)} .tile b{color:var(--brand)}
.toast{background:var(--brand);color:#1a1005;font-family:var(--display);font-weight:600}
.weekflash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none;padding:16px;font-family:"Bungee",sans-serif;font-size:clamp(34px,9vw,84px);color:#ffc24d;text-shadow:0 4px 0 #7a4a05,0 0 40px rgba(245,166,35,.7);text-align:center;animation:wf 1.6s ease-out forwards}
@keyframes wf{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.05)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
@keyframes wfr{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.arrow,.node.late{animation:none}.weekflash{animation:wfr 1.6s forwards}.seat:hover{transform:none}}
</style>

<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="scroll"><div class="wrap" id="app"><div class="panel"><h1>Beer Game</h1><p class="muted">Connexion à la session partagée…</p></div></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
"use strict";
var ROLES=[
 {k:"retailer",n:"Détaillant",c:"--s1",d:"Vend au consommateur final. Commande au grossiste."},
 {k:"wholesaler",n:"Grossiste",c:"--s2",d:"Livre le détaillant. Commande au distributeur."},
 {k:"distributor",n:"Distributeur",c:"--s3",d:"Livre le grossiste. Commande à l'usine."},
 {k:"factory",n:"Usine",c:"--s4",d:"Livre le distributeur. Lance la production de bière."}];
var DEF={weeks:30,orderDelay:2,shipDelay:2,prodDelay:2,hold:0.5,back:1,initInv:12,demandType:"step",dBase:4,dNew:8,dWeek:5,dLen:3,custom:"",visibility:"classic",showWeeks:false};

/* ---------- moteur de simulation (pur) ---------- */
function demandAt(p,t){
  if(p.demandType==="manual"){var mm=p.manual||{};return mm[t]!=null?mm[t]:0}
  if(p.demandType==="custom"){var a=String(p.custom||"").split(/[\s,;]+/).map(Number).filter(function(x){return isFinite(x)&&x>=0});if(a.length)return a[Math.min(t,a.length)-1]}
  if(p.demandType==="spike")return (t>=p.dWeek&&t<p.dWeek+p.dLen)?p.dNew:p.dBase;
  return t>=p.dWeek?p.dNew:p.dBase;
}
function seatOrders(g,seats,k){var s=seats[k];return (s&&s.gameId===g.gameId&&s.orders)||{}}
function simulate(g,seats){
  var p=g.params,f=p.dBase,T=g.endWeek!=null?g.endWeek:p.weeks,auto=g.auto||{},W=T+1;
  ROLES.forEach(function(R){if(auto[R.k])return;var o=seatOrders(g,seats,R.k),n=0;while(o[n+1]!=null)n++;W=Math.min(W,n+1)});
  if(g.status==="lobby")W=1;
  var need=false;if(p.demandType==="manual"){var mn=p.manual||{},nd=0;while(mn[nd+1]!=null)nd++;W=Math.min(W,nd+1);need=g.status!=="lobby"&&g.status!=="finished"&&W<=T&&mn[W]==null}
  var last=Math.min(W,T);
  var st=ROLES.map(function(R,i){var L=i<3?p.orderDelay+p.shipDelay:p.prodDelay;return{inv:p.initInv,back:0,cum:0,sm:f,onOrder:f*L,L:L,rows:[]}});
  function gOrd(j,t){if(t<1)return f;var o=st[j].rows[t-1].order;return o==null?0:o}
  function gShip(j,t){return t<1?f:st[j].rows[t-1].ship}
  for(var t=1;t<=last;t++){
    ROLES.forEach(function(R,i){
      var s=st[i],arr=i<3?gShip(i+1,t-p.shipDelay):gOrd(3,t-p.prodDelay);
      s.inv+=arr;s.onOrder-=arr;
      var inc=i===0?demandAt(p,t):gOrd(i-1,t-p.orderDelay);
      var need=s.back+inc,ship=Math.min(s.inv,need);s.inv-=ship;s.back=need-ship;
      var cost=s.inv*p.hold+s.back*p.back;s.cum+=cost;
      s.sm+=0.3*(inc-s.sm);
      var sugg=Math.max(0,Math.round(s.sm+0.3*(p.initInv-(s.inv-s.back))+0.3*(s.sm*(s.L-1)-s.onOrder)));
      var order=seatOrders(g,seats,R.k)[t];
      if(order==null)order=auto[R.k]?sugg:null;
      if(order!=null)s.onOrder+=order;
      s.rows.push({t:t,arr:arr,inc:inc,ship:ship,inv:s.inv,back:s.back,cost:cost,cum:s.cum,order:order,sugg:sugg});
    });
  }
  /* arrivées déjà connues pour les semaines suivantes */
  var incoming=ROLES.map(function(R,i){var out=[];if(W>T)return out;var max=i<3?p.shipDelay:p.prodDelay-1;
    for(var k=1;k<=max;k++)out.push(i<3?gShip(i+1,W+k-p.shipDelay):gOrd(3,W+k-p.prodDelay));return out});
  return{needDemand:need,W:W,T:T,st:st,incoming:incoming,finished:W>T||g.status==="finished"};
}
function variance(a){if(a.length<2)return 0;var m=a.reduce(function(x,y){return x+y},0)/a.length;return a.reduce(function(x,y){return x+(y-m)*(y-m)},0)/a.length}
if(typeof module!=="undefined"){module.exports={simulate:simulate,DEF:DEF}}
</script>
<script>
"use strict";
(function(){
var app=document.getElementById("app");
var S={ready:false,local:false,slow:false,game:undefined,seats:{},uid:null,names:{},tab:null,cfg:null,cfgFor:null,draft:"",confirm:null,toast:null,busy:false};
var store=null,userCap=null,charts={},chartN=0;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n0(x){return Number(x).toLocaleString("fr-FR")}
function eur(x){return Number(x).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"}
function rid(){return Math.random().toString(36).slice(2,10)}
function toast(m){S.toast=m;render();clearTimeout(toast.t);toast.t=setTimeout(function(){S.toast=null;render()},4500)}
function merge(a,b){var o=Object.assign({},a);Object.keys(b).forEach(function(k){var v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v))?merge(a&&a[k]&&typeof a[k]==="object"?a[k]:{},v):v});return o}

/* ---------- stockage : base partagée, ou mémoire locale en démonstration ---------- */
function localStore(){
  var mem={game:null,seats:{}};function fire(){S.game=mem.game;S.seats=Object.assign({},mem.seats);S.ready=true;onState()}
  return{start:function(){fire()},
    setGame:function(d){mem.game=d;fire();return Promise.resolve()},
    updateGame:function(d){mem.game=merge(mem.game,d);fire();return Promise.resolve()},
    setSeat:function(k,d){mem.seats[k]=d;fire();return Promise.resolve()},
    updateSeat:function(k,d){mem.seats[k]=merge(mem.seats[k]||{},d);fire();return Promise.resolve()},
    claim:function(k,gid){var s=mem.seats[k];if(s&&s.gameId===gid&&s.uid&&s.uid!==S.uid)return Promise.resolve(false);
      mem.seats[k]=(s&&s.gameId===gid)?merge(s,{uid:S.uid}):{gameId:gid,uid:S.uid,orders:{}};fire();return Promise.resolve(true)}};
}
function remoteStore(db){
  var gref=db.doc("beergame/current"),col=db.collection("seats"),q={},got=0;
  function chain(key,fn){q[key]=(q[key]||Promise.resolve()).then(fn,fn);return q[key]}
  function fail(e){S.ready=true;S.dead=true;render()}
  return{start:function(){
      var timer=setTimeout(function(){S.slow=true;render()},10000);
      function ok(meta){got|=meta;if(got===3){S.ready=true}if(S.ready){clearTimeout(timer);S.slow=false}onState()}
      gref.onSnapshot(function(s){S.game=s.exists?s.data():null;ok(1)},function(e){clearTimeout(timer);fail(e)});
      col.onSnapshot(function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data()});S.seats=m;ok(2)},function(e){clearTimeout(timer);fail(e)});
    },
    setGame:function(d){return chain("g",function(){return gref.set(d)})},
    updateGame:function(d){return chain("g",function(){return gref.update(d)})},
    setSeat:function(k,d){return chain(k,function(){return col.doc(k).set(d)})},
    updateSeat:function(k,d){return chain(k,function(){return col.doc(k).update(d)})},
    claim:function(k,gid){return chain(k,function(){var ref=col.doc(k);
      return ref.acquire({holder:S.uid,ttlMs:4000}).then(function(l){if(!l.acquired)return false;
        return ref.get().then(function(s){var d=s.exists?s.data():null;
          if(d&&d.gameId===gid&&d.uid&&d.uid!==S.uid)return false;
          var w=(d&&d.gameId===gid)?ref.update({uid:S.uid}):ref.set({gameId:gid,uid:S.uid,orders:{}});
          return w.then(function(){return true})})})})}};
}
function localId(){var id=null;try{id=localStorage.getItem("bg-uid")}catch(e){}if(!id){id="anon-"+rid();try{localStorage.setItem("bg-uid",id)}catch(e){}}return id}

var CODE=(new URLSearchParams(location.search).get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
S.myName="";try{S.myName=localStorage.getItem("bg-name")||""}catch(e){}
S.gateName=S.myName;S.gateCode=CODE;
var PROLE=new URLSearchParams(location.search).get("p")||"";if(!ROLES.some(function(R){return R.k===PROLE}))PROLE="";
S.inv={};try{S.inv=JSON.parse(localStorage.getItem("bg-inv-"+CODE)||"{}")||{}}catch(e){}
function inviteLink(k){return location.origin+location.pathname+"?s="+CODE+"&p="+k}
function inviteBox(R,show){if(!show||S.local||!CODE)return "";
  return '<label class="f" for="inv-'+R.k+'">E-mail du joueur<input id="inv-'+R.k+'" data-inv="'+R.k+'" type="email" autocomplete="off" placeholder="prenom.nom@exemple.fr" value="'+esc(S.inv[R.k]||"")+'"></label>'+

function fbStore(fsdb){
  var gref=fsdb.collection("games").doc(CODE),col=gref.collection("seats"),q={},got=0;
  function chain(key,fn){q[key]=(q[key]||Promise.resolve()).then(fn,fn);return q[key]}
  function nm(d){if(d&&d.uid)d=Object.assign({name:d.uid===S.uid?S.myName:(S.names[d.uid]||"")},d);return d}
  return{start:function(){
      var timer=setTimeout(function(){S.slow=true;render()},10000);
      function ok(m){got|=m;if(got===3){S.ready=true;clearTimeout(timer);S.slow=false}onState()}
      function fail(){clearTimeout(timer);S.ready=true;S.dead=true;render()}
      gref.onSnapshot(function(s){S.game=s.exists?s.data():null;ok(1)},fail);
      col.onSnapshot(function(s){var m={};s.forEach(function(d){m[d.id]=d.data()});S.seats=m;ok(2)},fail)},
    setGame:function(d){d=Object.assign({hostName:S.myName},d);return chain("g",function(){return gref.set(d)})},
    updateGame:function(d){if(d.host)d=Object.assign({hostName:S.myName},d);return chain("g",function(){return gref.set(d,{merge:true})})},
    setSeat:function(k,d){d=nm(d);return chain(k,function(){return col.doc(k).set(d)})},
    updateSeat:function(k,d){return chain(k,function(){return col.doc(k).set(d,{merge:true})})},
    claim:function(k,gid){return chain(k,function(){var ref=col.doc(k);return fsdb.runTransaction(function(tx){return tx.get(ref).then(function(s){var d=s.exists?s.data():null;
      if(d&&d.gameId===gid&&d.uid&&d.uid!==S.uid)return false;
      if(d&&d.gameId===gid)tx.update(ref,{uid:S.uid,name:S.myName});else tx.set(ref,{gameId:gid,uid:S.uid,name:S.myName,orders:{}});
      return true})})})}};
}
function boot(){
  S.uid=localId();
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.projectId||cfg.projectId==="A_REMPLIR"||!window.firebase){S.local=true;store=localStore();store.start();return}
  if(!CODE){S.gate=true;S.ready=true;render();return}
  firebase.initializeApp(cfg);store=fbStore(firebase.firestore());store.start();
}

  try{localStorage.setItem("bg-name",n)}catch(e){}
  if(create){try{sessionStorage.setItem("bg-create",code)}catch(e){}}
  location.search="?s="+code+(PROLE?"&p="+PROLE:"")}

/* ---------- état dérivé ---------- */
function seat(k){var s=S.seats[k];return s&&S.game&&s.gameId===S.game.gameId?s:null}
function myRole(){for(var i=0;i<4;i++){var s=seat(ROLES[i].k);if(s&&s.uid===S.uid)return i}return -1}
function isHost(){return !!S.game&&S.game.host===S.uid}
function nameOf(uid){if(!uid)return "Libre";if(uid===S.uid)return "Vous";return S.names[uid]||"Joueur"}
function onState(){
  var g=S.game;
  if(g){if(g.host&&g.hostName)S.names[g.host]=g.hostName;ROLES.forEach(function(R){var s=S.seats[R.k];if(s&&s.uid&&s.name)S.names[s.uid]=s.name})}
  if(S.ready&&!g&&!S.local&&!S.creating&&S.myName){var cf=null;try{cf=sessionStorage.getItem("bg-create")}catch(e){}
    if(cf===CODE){S.creating=true;try{sessionStorage.removeItem("bg-create")}catch(e){}act(ACT.create())}}
  if(PROLE&&!S.autoClaimed&&S.ready&&g&&!S.local){S.autoClaimed=true;var ps=seat(PROLE);
    if(S.myName&&myRole()<0&&!(g.auto&&g.auto[PROLE])&&!(ps&&ps.uid))act(ACT.claim(PROLE));
    if(!isHost())S.tab="poste"}
  if(g&&S.cfgFor!==g.gameId){S.cfg=Object.assign({},DEF,g.params||{});S.cfgFor=g.gameId;S.draft="";S.confirm=null}
  render();
  if(userCap&&g){var ids=[g.host].concat(ROLES.map(function(R){var s=seat(R.k);return s&&s.uid})).filter(function(x){return x&&x.indexOf("u_")===0});
    if(ids.length)userCap.profiles(ids).then(function(ps){var ch=false;ids.forEach(function(i){var nm=ps[i]&&ps[i].name||"";if(nm&&S.names[i]!==nm){S.names[i]=nm;ch=true}});if(ch)render()})}
}

/* ---------- actions ---------- */
function cleanCfg(){var c=Object.assign({},DEF,S.cfg);function cl(k,a,b,int){var v=Number(c[k]);if(!isFinite(v))v=DEF[k];v=Math.min(b,Math.max(a,v));c[k]=int?Math.round(v):v}
  cl("weeks",5,60,1);cl("orderDelay",1,4,1);cl("shipDelay",1,4,1);cl("prodDelay",1,4,1);cl("hold",0,10);cl("back",0,10);cl("initInv",0,100,1);
  cl("dBase",0,50,1);cl("dNew",0,100,1);cl("dWeek",1,60,1);cl("dLen",1,30,1);c.showWeeks=!!c.showWeeks;c.manual={};c.custom=String(c.custom||"").slice(0,400);return c}

  var auto=keep&&S.game?S.game.auto||{}:{};
  var p=store.setGame({gameId:gid,host:S.uid,status:"lobby",params:cleanCfg(),auto:auto,endWeek:null});

  S.tab="anim";return p}

  invite:function(k){var em=String(S.inv[k]||"").trim();if(!/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(em)){toast("Saisissez une adresse e-mail valide pour ce poste.");return}

  demand:function(){var q=Math.round(Number(S.dem));if(S.dem===""||S.dem==null||!isFinite(q)||q<0||q>999){toast("Saisissez une demande entre 0 et 999.");return}
    var sim=simulate(S.game,S.seats);if(!sim.needDemand||!isHost())return;var m={};m[sim.W]=q;S.dem="";return store.updateGame({params:{manual:m}})},

};

/* ---------- graphiques ---------- */
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1e-9)))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(title,series,T){
  var id="ch"+(chartN++),Wd=720,H=290,m={l:42,r:104,t:14,b:32},lo=0,hi=1;
  series.forEach(function(s){s.v.forEach(function(x){if(x!=null){lo=Math.min(lo,x);hi=Math.max(hi,x)}})});
  var step=niceStep((hi-lo)/5);step=Math.max(step,1);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  var n=Math.max(T,2),X=function(t){return m.l+(t-1)/(n-1)*(Wd-m.l-m.r)},Y=function(v){return m.t+(hi-v)/(hi-lo)*(H-m.t-m.b)};
  var o='<svg viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="'+esc(title)+'">';
  for(var v=lo;v<=hi+1e-9;v+=step){o+='<line x1="'+m.l+'" x2="'+(Wd-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--'+(v===0?"axis":"line")+')" stroke-width="1"/>'+
    '<text x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+n0(v)+'</text>'}
  var xs=T<=12?1:T<=30?5:10;
  for(var t=1;t<=T;t++)if(t===1||t%xs===0)o+='<text x="'+X(t)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)">S'+t+'</text>';
  var ends=[];
  series.forEach(function(s){var d="",lastT=0;s.v.forEach(function(x,i){if(x==null)return;d+=(d?"L":"M")+X(i+1).toFixed(1)+" "+Y(x).toFixed(1);lastT=i+1});
    if(!d)return;o+='<path d="'+d+'" fill="none" stroke="var('+s.c+')" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
    o+='<circle cx="'+X(lastT)+'" cy="'+Y(s.v[lastT-1])+'" r="4" fill="var('+s.c+')" stroke="var(--surface)" stroke-width="2"/>';
    ends.push({x:X(lastT),y:Y(s.v[lastT-1]),n:s.n})});
  ends.sort(function(a,b){return a.y-b.y});
  for(var i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
  var over=ends.length?ends[ends.length-1].y-(H-m.b):0;if(over>0)ends.forEach(function(e){e.y-=over});
  ends.forEach(function(e){o+='<text x="'+(e.x+9)+'" y="'+(e.y+4)+'" font-size="11.5" fill="var(--ink2)">'+esc(e.n)+'</text>'});
  o+='<line class="cross" x1="0" x2="0" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="var(--ink2)" stroke-width="1" visibility="hidden"/></svg>';
  charts[id]={series:series,T:T,l:m.l,r:m.r,W:Wd};
  var lg=series.map(function(s){return '<span><i class="'+(s.dash?"dash":"")+'" style="--c:var('+s.c+')"></i>'+esc(s.n)+'</span>'}).join("");
  return '<div><h3>'+esc(title)+'</h3><div class="legend" style="margin:6px 0">'+lg+'</div><div class="chart" data-chart="'+id+'">'+o+'<div class="tip" hidden></div></div></div>';
}
app.addEventListener("pointermove",function(e){var c=e.target.closest("[data-chart]");if(!c)return;var d=charts[c.getAttribute("data-chart")];if(!d)return;
  var svg=c.querySelector("svg"),r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*d.W,n=Math.max(d.T,2);
  var t=Math.round((x-d.l)/(d.W-d.l-d.r)*(n-1))+1;t=Math.min(d.T,Math.max(1,t));
  var cx=d.l+(t-1)/(n-1)*(d.W-d.l-d.r),cr=svg.querySelector(".cross");cr.setAttribute("x1",cx);cr.setAttribute("x2",cx);cr.setAttribute("visibility","visible");
  var tip=c.querySelector(".tip"),h="<strong>Semaine "+t+"</strong>";
  d.series.forEach(function(s){var v=s.v[t-1];if(v!=null)h+='<div><span><span class="dot" style="background:var('+s.c+')"></span> '+esc(s.n)+'</span><span>'+n0(v)+'</span></div>'});
  tip.innerHTML=h;tip.hidden=false;var px=cx/d.W*r.width+c.scrollLeft;tip.style.left=(px>r.width*0.6?px-175:px+14)+"px";
});
app.addEventListener("pointerleave",function(e){var c=e.target.closest&&e.target.closest("[data-chart]");if(!c)return;c.querySelector(".tip").hidden=true;c.querySelector(".cross").setAttribute("visibility","hidden")},true);

function chainCharts(sim){
  var p=S.game.params,T=sim.T,wk=Math.min(sim.W,T),dem=[];for(var t=1;t<=wk;t++)dem.push(demandAt(p,t));
  var ord=ROLES.map(function(R,i){return{n:R.n,c:R.c,v:sim.st[i].rows.map(function(r){return r.order})}});
  ord.push({n:"Demande client",c:"--ink",dash:true,v:dem});
  var net=ROLES.map(function(R,i){return{n:R.n,c:R.c,v:sim.st[i].rows.map(function(r){return r.inv-r.back})}});
  return lineChart("Commandes passées par poste (caisses par semaine)",ord,T)+lineChart("Stock net par poste (stock moins commandes en retard, en caisses)",net,T);
}

function crates(n){var o="",k=Math.min(n,32);for(var i=0;i<k;i++)o+="<i></i>";return k?'<span class="crates" aria-hidden="true">'+o+'</span>':""}
var flashKey=null;
function weekFlash(sim){var g=S.game;if(!sim||!g||g.status==="lobby"){flashKey=null;return}
  var key=g.gameId+":"+(sim.finished?"fin":sim.W);if(flashKey!==null&&flashKey!==key&&flashKey.split(":")[0]===g.gameId){
    var d=document.createElement("div");d.className="weekflash";d.textContent=sim.finished?"Partie terminée":"Semaine "+sim.W;document.body.appendChild(d);setTimeout(function(){d.remove()},1700)}
  flashKey=key}
function statusPill(sim){var g=S.game;if(!g)return "";
  if(g.status==="lobby")return '<span class="pill amber">Salle d\'attente</span>';
  if(sim.finished)return '<span class="pill">Partie terminée</span>';
  var w="Semaine "+sim.W+((isHost()||g.params.showWeeks)?" / "+sim.T:"");
  return '<span class="pill on">'+w+'</span>'+(g.status==="paused"?'<span class="pill amber">En pause</span>':"");
}

    if(!auto&&uid&&uid!==S.uid)b+='<span class="pill amber">Déjà pris</span>';if(!auto&&uid&&uid===S.uid)b+='<span class="pill on">Votre poste</span>';if(auto)b+='<span class="pill">Automatique</span>';

}

    '<div class="node'+(row.back>0?" late":"")+'"><span class="eyebrow">Client : '+down+'</span><b>'+n0(row.back)+'</b><span class="small muted">caisses en retard</span><span class="small muted">commandé : '+n0(row.inc)+' · livré : '+n0(row.ship)+'</span></div>';

    '<span class="small muted">Stock : '+eur(p.hold)+' par caisse et par semaine. Retard : '+eur(p.back)+'.</span></div>';
  o+=mid;
  if(p.visibility!=="classic"){var d=[];for(var t=Math.max(1,wk-5);t<=wk;t++)d.push("S"+t+" : "+demandAt(p,t));
    o+='<div class="info"><strong>Demande des consommateurs</strong> (information partagée) — '+d.join(" · ")+'</div>'}

    return '<tr><td><span class="dot" style="background:var('+Q.c+')"></span> '+Q.n+'</td><td>'+n0(c.inv)+'</td><td>'+n0(c.back)+'</td><td>'+(pv==null?"–":n0(pv))+'</td></tr>'}).join("")+'</tbody></table></div>';
  o+='</div>';
  var rows=s.rows.slice().reverse().map(function(r){return '<tr><td>S'+r.t+'</td><td>'+n0(r.arr)+'</td><td>'+n0(r.inc)+'</td><td>'+n0(r.ship)+'</td><td>'+n0(r.inv)+'</td><td>'+n0(r.back)+'</td><td>'+(r.order==null?"–":n0(r.order))+'</td><td>'+eur(r.cost)+'</td></tr>'}).join("");
  o+='<div class="panel">'+lineChart("Votre poste, semaine après semaine (caisses)",[{n:"Stock net",c:R.c,v:s.rows.map(function(r){return r.inv-r.back})},{n:"Vos commandes",c:"--ink",dash:true,v:s.rows.map(function(r){return r.order})}],(isHost()||p.showWeeks||sim.finished)?sim.T:Math.max(wk,10))+
    '<details><summary>Historique détaillé</summary><div class="tw" style="margin-top:10px"><table><thead><tr><th>Semaine</th><th>Reçu</th><th>Commande client</th><th>Livré</th><th>Stock</th><th>Retard</th><th>Commandé</th><th>Coût</th></tr></thead><tbody>'+rows+'</tbody></table></div></details></div>';
  return o;

function viewDebrief(sim){var g=S.game,p=g.params;
  if(g.status==="lobby")return '<div class="panel"><p class="muted">Le débrief apparaîtra ici une fois la partie lancée.</p></div>';
  var wk=Math.min(sim.W,sim.T),dem=[];for(var t=1;t<=wk;t++)dem.push(demandAt(p,t));var vd=variance(dem),tot=0;
  var st=ROLES.map(function(R,i){var rows=sim.st[i].rows,ord=rows.map(function(r){return r.order}).filter(function(x){return x!=null});tot+=sim.st[i].cum;
    return{R:R,cost:sim.st[i].cum,amp:vd>0&&ord.length>1?variance(ord)/vd:null,peak:ord.length?Math.max.apply(null,ord):0,back:Math.max.apply(null,rows.map(function(r){return r.back})),inv:Math.max.apply(null,rows.map(function(r){return r.inv}))}});
  var o='<div class="panel"><div class="top"><h2>Débrief'+(sim.finished?"":" (partie en cours, vue formateur)")+'</h2><span class="pill num">'+wk+' semaines jouées</span></div>'+
    '<div class="tiles"><div class="tile"><span class="eyebrow">Coût total de la chaîne</span><b class="num">'+eur(tot)+'</b></div>'+st.map(function(x){return '<div class="tile" style="border-top:3px solid var('+x.R.c+')"><span class="eyebrow">'+x.R.n+' · rang '+(st.filter(function(y){return y.cost<x.cost}).length+1)+'</span><b class="num">'+eur(x.cost)+'</b></div>'}).join("")+'</div>'+
    '<p class="muted small">La demande des consommateurs a varié entre '+n0(Math.min.apply(null,dem))+' et '+n0(Math.max.apply(null,dem))+' caisses par semaine. Comparez avec les pics de commande ci-dessous.</p>'+
    '<div class="tw"><table><thead><tr><th>Poste</th><th>Amplification des commandes</th><th>Commande maximale</th><th>Retard maximal</th><th>Stock maximal</th><th>Coût</th></tr></thead><tbody>'+
    st.map(function(x){return '<tr><td><span class="dot" style="background:var('+x.R.c+')"></span> '+x.R.n+'</td><td>'+(x.amp==null?"–":"× "+x.amp.toLocaleString("fr-FR",{maximumFractionDigits:1}))+'</td><td>'+n0(x.peak)+'</td><td>'+n0(x.back)+'</td><td>'+n0(x.inv)+'</td><td>'+eur(x.cost)+'</td></tr>'}).join("")+
    '</tbody></table></div><p class="small muted">Amplification : variance des commandes du poste divisée par la variance de la demande des consommateurs. Au-dessus de 1, le poste amplifie les variations.</p></div>';
  o+='<div class="panel">'+chainCharts(sim)+'</div>';
  o+='<div class="panel"><div class="prose"><h2>Questions pour le groupe</h2><ol><li>Qu\'avez-vous ressenti pendant la partie ? À quel moment avez-vous perdu le contrôle ?</li><li>Selon vous, comment la demande des consommateurs a-t-elle évolué ? (Faites répondre les trois postes amont avant de montrer la courbe.)</li><li>Qui est responsable des ruptures et des surstocks ? Un joueur, ou la structure du jeu ?</li><li>Qu\'avez-vous oublié en passant vos commandes ? (Les caisses déjà commandées mais pas encore livrées.)</li><li>Si vous rejouiez, que changeriez-vous sans modifier les règles ? Et en modifiant les règles ?</li><li>Où retrouvez-vous cette dynamique chez vos clients ?</li></ol></div></div>';
  var head='<tr><th>Semaine</th><th>Demande</th>'+ROLES.map(function(R){return '<th>'+R.n+' : commande</th><th>stock net</th>'}).join("")+'</tr>',body="";
  for(var w=1;w<=wk;w++)body+='<tr><td>S'+w+'</td><td>'+dem[w-1]+'</td>'+ROLES.map(function(R,i){var r=sim.st[i].rows[w-1];return '<td>'+(r.order==null?"–":r.order)+'</td><td>'+(r.inv-r.back)+'</td>'}).join("")+'</tr>';
  o+='<div class="panel"><details><summary>Données complètes, semaine par semaine</summary><div class="tw" style="margin-top:10px"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></details></div>';
  return o;
}
function viewRules(){var p=(S.game&&S.game.params)||DEF;
  return '<div class="panel"><div class="prose"><h2>Règles du jeu</h2>'+
  '<p>Vous tenez un maillon d\'une chaîne qui distribue de la bière : usine → distributeur → grossiste → détaillant → consommateurs. Votre objectif est de <strong>minimiser le coût total</strong> de votre poste sur toute la partie.</p>'+
  '<h3>Chaque semaine</h3><ol><li>Vous recevez les caisses expédiées par votre fournisseur quelques semaines plus tôt.</li><li>Vous recevez la commande de votre client.</li><li>Vous livrez automatiquement tout ce que votre stock permet, en commençant par les commandes en retard.</li><li>Vous décidez d\'une seule chose : la quantité à commander à votre fournisseur.</li></ol>'+
  '<h3>Délais</h3><ul><li>Votre commande met '+p.orderDelay+' semaine(s) à parvenir à votre fournisseur.</li><li>Une livraison met '+p.shipDelay+' semaine(s) à vous parvenir, si le fournisseur a le stock.</li><li>À l\'usine, la production demande '+p.prodDelay+' semaine(s).</li></ul>'+
  '<h3>Coûts</h3><ul><li>'+eur(p.hold)+' par caisse en stock, chaque semaine.</li><li>'+eur(p.back)+' par caisse commandée et non livrée, chaque semaine. Une commande en retard reste due.</li></ul>'+
  '<h3>Une seule contrainte</h3><p>On ne se parle pas entre postes. La seule information qui circule est la commande que vous passez.</p></div></div>';
}
function viewGuide(){
  return '<div class="panel"><div class="prose"><h2>Guide du formateur</h2><p>Ce guide n\'est visible que par le formateur. Durée conseillée : 1 h 45 pour une manche et son débrief, 2 h 30 avec une seconde manche.</p>'+
  '<h3>Objectifs pédagogiques</h3><ul><li>Faire vivre l\'effet coup de fouet : une petite variation de la demande finale devient une oscillation violente en amont.</li><li>Montrer que le comportement vient de la structure (délais, information locale) et non des personnes.</li><li>Donner aux consultants un vocabulaire et une expérience commune pour parler de pilotage de flux, de S&amp;OP et de partage d\'information avec leurs clients.</li></ul>'+
  '<h3>Préparation</h3><ul><li>Envoyez aux participants l\'adresse de la page une fois la session créée : elle contient le code de session. Chacun saisit son prénom en arrivant.</li><li>4 joueurs, un par poste. Avec 8 participants, jouez en binômes sur un même écran. Avec moins de 4, passez les postes vides en automatique.</li><li>Gardez le préréglage « Classique MIT » pour la première manche et n\'annoncez pas la durée.</li><li>Séparez physiquement les postes si possible. En visio, interdisez la messagerie.</li></ul>'+
  '<h3>Déroulé</h3><div class="steps"><span>0:00 – 0:10</span><span>Accueil. Présentez la chaîne et l\'objectif de coût. Ne prononcez pas les mots « coup de fouet ».</span><span>0:10 – 0:20</span><span>Lecture des règles (onglet Règles), choix des postes, questions.</span><span>0:20 – 1:00</span><span>Partie. Comptez environ 1 minute par semaine, plus vite après la semaine 10. Ne commentez rien.</span><span>1:00 – 1:10</span><span>Pause. Chaque joueur note sur papier sa perception de la demande finale.</span><span>1:10 – 1:45</span><span>Débrief avec l\'onglet Débrief projeté.</span><span>en option</span><span>Seconde manche de 20 semaines en « Chaîne transparente » ou « Délais courts », puis comparaison des coûts.</span></div>'+
  '<h3>Pendant la partie</h3><ul><li>Suivez l\'onglet Animation. Si un joueur bloque la semaine, relancez-le, puis utilisez « Commander à sa place ».</li><li>Notez les réactions à voix haute (« ils font n\'importe quoi au-dessus »). Elles nourrissent le débrief.</li><li>Attendez-vous à des ruptures vers les semaines 8 à 15, puis à des surstocks massifs.</li></ul>'+
  '<h3>Conduite du débrief</h3><ol><li><strong>Le vécu.</strong> Faites parler chaque poste, du détaillant à l\'usine. Laissez s\'exprimer les reproches.</li><li><strong>La révélation.</strong> Demandez à l\'amont de dessiner la demande finale, puis montrez la courbe : un seul changement, dès le début.</li><li><strong>Les causes.</strong> Délais, commandes en cours oubliées, sur-réaction aux ruptures, absence de visibilité sur la demande réelle.</li><li><strong>Les remèdes.</strong> Partage de la demande finale, réduction des délais, commandes plus petites et plus fréquentes, pilotage par le stock et les encours, coordination entre maillons.</li><li><strong>Le transfert.</strong> Chaque consultant cite une situation client où il a vu cette dynamique, et ce qu\'il y ferait différemment.</li></ol>'+
  '<h3>Messages clés</h3><ul><li>La structure d\'un système produit son comportement. Changer les personnes sans changer la structure reproduit le résultat.</li><li>Une décision localement rationnelle peut dégrader l\'ensemble de la chaîne.</li><li>L\'information coûte moins cher que le stock.</li></ul>'+
  '<h3>Paramètres : que change quoi</h3><ul><li><strong>Délais.</strong> Plus ils sont longs, plus l\'oscillation est forte. Passer à 1 semaine la réduit nettement.</li><li><strong>Visibilité.</strong> Partager la demande finale calme l\'amont sans rien changer à la physique des flux.</li><li><strong>Coût de retard.</strong> L\'augmenter pousse au surstock et amplifie les commandes de panique.</li><li><strong>Profil de demande.</strong> Le palier suffit à déclencher l\'effet. Le pic montre qu\'un événement passager laisse des traces pendant des semaines.</li></ul></div></div>';
}

function render(){
  var ae=document.activeElement,fid=ae&&ae.id,ss=null;try{if(fid&&ae.type==="text")ss=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  charts={};chartN=0;var g=S.game,o="";
  o+='<div class="top"><div class="brand"><h1>Beer Game</h1><span>Brassez, livrez, survivez au coup de fouet</span></div><div class="pills">';
  if(CODE&&!S.gate&&!S.local)o+='<span class="pill">Session '+CODE+'</span>';var sim=null;
  if(S.ready&&g){sim=simulate(g,S.seats);o+=statusPill(sim);var mr=myRole();
    if(isHost())o+='<span class="pill on">Vous animez</span>';
    if(mr>=0)o+='<span class="pill"><span class="dot" style="background:var('+ROLES[mr].c+')"></span>'+ROLES[mr].n+'</span>'}
  o+='</div></div>';
  if(S.local)o+='<div class="note">Mode démonstration : Firebase n\'est pas encore configuré (fichier config.js), rien n\'est enregistré ni partagé. Vous pouvez tout de même essayer une partie contre l\'ordinateur.</div>';
  if(S.dead)o+='<div class="note">La connexion à la session partagée a été interrompue. Rouvrez la page pour reprendre.</div>';
  if(!S.ready){o+='<div class="panel"><p class="muted">'+(S.slow?"La session partagée ne répond pas encore. La page se mettra à jour dès qu\'elle sera joignable.":"Connexion à la session partagée…")+'</p></div>'}
  else if(S.gate){o+=viewHome()}else if(!g){o+=viewWait()}
  else{
    var tabs=[["poste","Mon poste"]];if(isHost())tabs.push(["anim","Animation"]);if(isHost()||sim.finished)tabs.push(["debrief","Débrief"]);tabs.push(["regles","Règles"]);if(isHost())tabs.push(["guide","Guide du formateur"]);
    if(!tabs.some(function(t){return t[0]===S.tab}))S.tab=isHost()?"anim":"poste";
    o+='<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")+'</div><div class="stack">';
    o+=nameBar();o+=S.tab==="anim"?viewAnim(sim):S.tab==="debrief"?viewDebrief(sim):S.tab==="regles"?viewRules():S.tab==="guide"?viewGuide():viewPoste(sim);
    o+='</div>';
  }
  if(S.toast)o+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  app.innerHTML=o;
  window.BGSTATE={role:(S.ready&&g)?myRole():-1,run:!!(g&&g.status==="running")};weekFlash(sim);
  if(fid){var el=document.getElementById(fid);if(el){el.focus();if(ss){try{el.setSelectionRange(ss[0],ss[1])}catch(e){}}}}
}
render();boot();
})();
</script>

<script>
"use strict";
(function(){
var c=document.getElementById("bg");if(!c||!c.getContext)return;
var x=c.getContext("2d"),W=0,H=0,bub=[],T=0,dist=0,last=0;
var red=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var NAMES=["USINE","DISTRIBUTEUR","GROSSISTE","DÉTAILLANT"],COL=["#c98500","#199e70","#d95926","#3987e5"];
var BODY="#4a3116",EDGE="#8a6630",AMB="245,166,35";
function size(){var D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);x.setTransform(D,0,0,D,0,0);
  bub=[];var n=Math.round(Math.min(70,W*H/16000));for(var i=0;i<n;i++)bub.push({x:Math.random()*W,y:Math.random()*H,r:1.5+Math.random()*5,v:12+Math.random()*30,p:Math.random()*6.28})}
function box(px,py,w,h,f,s){x.fillStyle=f;x.fillRect(px,py,w,h);if(s){x.strokeStyle=s;x.lineWidth=1;x.strokeRect(px+.5,py+.5,w-1,h-1)}}
function win(px,py,w,h,i){x.fillStyle="rgba("+AMB+","+(0.55+0.25*Math.sin(T*2+i+px)).toFixed(2)+")";x.fillRect(px,py,w,h)}
function station(i,cx,b,s,hi){
  x.save();
  if(hi){x.shadowColor=COL[i];x.shadowBlur=26}
  if(i===0){ /* brasserie : cuves en cuivre, toit en dents de scie, cheminée qui mousse */
    box(cx-46*s,b-48*s,92*s,48*s,BODY,EDGE);
    x.fillStyle=BODY;x.beginPath();for(var k=0;k<3;k++){var rx=cx-46*s+k*30.6*s;x.moveTo(rx,b-48*s);x.lineTo(rx,b-66*s);x.lineTo(rx+30.6*s,b-48*s)}x.fill();
    box(cx+26*s,b-92*s,11*s,44*s,BODY,EDGE);
    x.shadowBlur=0;
    for(var q=0;q<2;q++){var tx=cx-38*s+q*24*s;x.fillStyle="#b5651d";x.beginPath();x.moveTo(tx,b);x.lineTo(tx,b-34*s);x.arc(tx+9*s,b-34*s,9*s,Math.PI,0);x.lineTo(tx+18*s,b);x.fill();box(tx,b-20*s,18*s,2*s,"#7a3f0e")}
    win(cx+8*s,b-34*s,10*s,10*s,i);
    for(var p=0;p<3;p++){var u=(T*14+p*12)%36;x.fillStyle="rgba(255,243,220,"+(0.5*(1-u/36)).toFixed(2)+")";x.beginPath();x.arc(cx+31.5*s+Math.sin(T+p)*3*s,b-94*s-u*s,(4+u/6)*s,0,6.29);x.fill()}
  }else if(i===1){ /* entrepôt du distributeur : toit en arche, grande porte */
    box(cx-52*s,b-36*s,104*s,36*s,BODY,EDGE);
    x.fillStyle=BODY;x.beginPath();x.ellipse(cx,b-36*s,52*s,20*s,0,Math.PI,0);x.fill();
    x.shadowBlur=0;
    box(cx-16*s,b-28*s,32*s,28*s,"#1a1107",EDGE);for(var l=1;l<5;l++)box(cx-16*s,b-28*s+l*5.6*s,32*s,1,EDGE);
    win(cx-42*s,b-28*s,12*s,8*s,i);win(cx+30*s,b-28*s,12*s,8*s,i);
  }else if(i===2){ /* grossiste : hangar et piles de caisses */
    box(cx-38*s,b-34*s,56*s,34*s,BODY,EDGE);
    x.fillStyle=BODY;x.beginPath();x.moveTo(cx-42*s,b-34*s);x.lineTo(cx-10*s,b-54*s);x.lineTo(cx+22*s,b-34*s);x.fill();
    x.shadowBlur=0;
    win(cx-28*s,b-26*s,10*s,10*s,i);box(cx-8*s,b-22*s,16*s,22*s,"#1a1107",EDGE);
    [[24,0],[37,0],[30,13]].forEach(function(o){box(cx+o[0]*s,b-(o[1]+12)*s,12*s,12*s,"#d98f12","#7a4a05")});
  }else{ /* détaillant : le bar, son store rayé et sa chope en enseigne */
    box(cx-34*s,b-46*s,68*s,46*s,BODY,EDGE);
    x.shadowBlur=0;
    for(var a=0;a<6;a++)box(cx-38*s+a*12.7*s,b-34*s,12.7*s,8*s,a%2?"#fff3dc":"#f5a623");
    win(cx-26*s,b-22*s,20*s,14*s,i);box(cx+6*s,b-22*s,16*s,22*s,"#1a1107",EDGE);
    box(cx+38*s,b-70*s,2*s,26*s,EDGE);
    box(cx+42*s,b-70*s,12*s,15*s,"#f5a623","#7a4a05");box(cx+41*s,b-74*s,14*s,5*s,"#fff3dc");
    x.strokeStyle="#f5a623";x.lineWidth=2*s;x.beginPath();x.arc(cx+55*s,b-62*s,4*s,-1.57,1.57);x.stroke();
  }
  x.restore();
  x.font=(hi?"700 ":"600 ")+Math.round(11*s)+"px 'Chakra Petch',system-ui,sans-serif";x.textAlign="center";
  x.fillStyle=hi?COL[i]:"rgba(226,207,168,.55)";x.fillText(NAMES[i]+(hi?" · VOUS":""),cx,b-104*s);
}
function truck(tx,b,s){
  box(tx,b-8*s,30*s,17*s,"#f5a623","#7a4a05");box(tx+10*s,b-8*s,1,17*s,"#7a4a05");box(tx+20*s,b-8*s,1,17*s,"#7a4a05");
  box(tx+31*s,b-3*s,13*s,12*s,"#e2cfa8","#5a3f1c");box(tx+36*s,b-1*s,6*s,5*s,"#3987e5");
  x.fillStyle="rgba(255,243,220,.5)";x.beginPath();x.moveTo(tx+44*s,b+5*s);x.lineTo(tx+62*s,b+1*s);x.lineTo(tx+62*s,b+10*s);x.fill();
  [7,24,37].forEach(function(o){x.fillStyle="#050302";x.beginPath();x.arc(tx+o*s,b+10*s,4*s,0,6.29);x.fill();x.fillStyle="#8a7650";x.beginPath();x.arc(tx+o*s,b+10*s,1.5*s,0,6.29);x.fill()});
}
function draw(){
  var st=window.BGSTATE||{role:-1,run:false};
  var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0c0704");g.addColorStop(.6,"#1b1006");g.addColorStop(1,"#3a2206");x.fillStyle=g;x.fillRect(0,0,W,H);
  bub.forEach(function(b){var yy=((b.y-T*b.v)%H+H)%H,xx=b.x+Math.sin(T*.8+b.p)*6;x.strokeStyle="rgba("+AMB+",.22)";x.lineWidth=1;x.beginPath();x.arc(xx,yy,b.r,0,6.29);x.stroke();
    x.fillStyle="rgba(255,243,220,.18)";x.beginPath();x.arc(xx-b.r*.3,yy-b.r*.3,b.r*.25,0,6.29);x.fill()});
  var s=Math.max(.5,Math.min(1.15,W/1000)),base=H-34*s;
  /* flux d'information : les bons de commande remontent vers l'usine */
  var iy=base-128*s;x.strokeStyle="rgba(255,243,220,.14)";x.lineWidth=1;x.setLineDash([4,8]);x.lineDashOffset=dist*20;x.beginPath();x.moveTo(0,iy);x.lineTo(W,iy);x.stroke();x.setLineDash([]);
  for(var k=0;k<3;k++){var px=W+20-((dist*55+k*(W+40)/3)%(W+40));box(px,iy-7*s,10*s,13*s,"rgba(255,243,220,.6)");box(px+2*s,iy-4*s,6*s,1,"#5a3f1c");box(px+2*s,iy-1*s,6*s,1,"#5a3f1c");box(px+2*s,iy+2*s,4*s,1,"#5a3f1c")}
  for(var i=0;i<4;i++)station(i,W*(0.12+0.253*i),base,s,st.role>=0&&3-st.role===i);
  /* flux physique : la route et les camions de caisses descendent vers le bar */
  box(0,base,W,34*s,"#0a0603");box(0,base,W,1,"#5a3f1c");
  for(var d=0;d<W;d+=44)box(d,base+20*s,20,2,"rgba("+AMB+",.3)");
  for(var t=0;t<4;t++)truck(((dist*60+t*(W+140)/4)%(W+140))-70,base,s);
}
function frame(now){var dt=Math.min(.05,(now-last)/1000||0);last=now;T+=dt;dist+=dt*((window.BGSTATE&&window.BGSTATE.run)?1.6:1);draw();requestAnimationFrame(frame)}
size();window.addEventListener("resize",function(){size();draw()});
if(red){draw();setInterval(draw,1500)}else requestAnimationFrame(frame);
})();
</script>
